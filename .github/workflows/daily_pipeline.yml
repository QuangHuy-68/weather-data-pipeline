name: Daily Weather Pipeline & Telegram Alert

on: 
    schedule:
        - cron: '0 0 * * *'
    workflow_dispatch:

permissions:
    contents: write

jobs: 
    run-pipeline:
        runs-on: ubuntu-latest

        steps: 
            - name: 1. Checkout repository code 
              uses: actions/checkout@v4

            - name: 2. Set up Python 3.12
              uses: actions/setup-python@v5
              with:
                python-version: "3.12"
      
            - name: 3. Install dependencies
              run: |
                python -m pip install --upgrade pip
                pip install -r requirements.txt
      
            - name: 4. Run Weather Pipeline & Send Telegram Alert
              env:
                LATITUDE: "10.8231"
                LONGITUDE: "106.6297"
                TIMEZONE: "Asia/Ho_Chi_Minh"
                TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
                TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
                PYTHONPATH: .
              run: |
                python pipeline.py
      
            - name: 5. Commit and push updated data to GitHub
              run: |
                git config --global user.name "github-actions[bot]"
                git config --global user.email "github-actions[bot]@users.noreply.github.com"
                git add database/weather.db data/process/ reports/ || true
                git commit -m "chore: automated daily weather update [skip ci]" || echo "No changes to commit"
                git push